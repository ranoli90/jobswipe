input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
    
    if [parsed] {
      # Move parsed fields to top level
      mutate {
        rename => { "[parsed][timestamp]" => "@timestamp" }
        rename => { "[parsed][level]" => "level" }
        rename => { "[parsed][logger]" => "logger_name" }
        rename => { "[parsed][message]" => "log_message" }
        rename => { "[parsed][correlation_id]" => "correlation_id" }
        rename => { "[parsed][service]" => "service" }
        rename => { "[parsed][environment]" => "environment" }
        rename => { "[parsed][source]" => "source" }
      }
      
      # Remove original message if we successfully parsed JSON
      mutate {
        remove_field => ["message", "parsed"]
      }
    }
  }
  
  # Add ECS (Elastic Common Schema) fields
  mutate {
    add_field => {
      "[ecs][version]" => "1.12.0"
      "[event][dataset]" => "%{[service]}"
      "[service][name]" => "%{[service]}"
      "[service][environment]" => "%{[environment]}"
    }
  }
  
  # Set log level from parsed data or default to INFO
  if ![level] {
    mutate {
      add_field => { "level" => "INFO" }
    }
  }
  
  # Map log level to ECS format
  translate {
    field => "level"
    destination => "[log][level]"
    dictionary => {
      "DEBUG" => "debug"
      "INFO" => "info"
      "WARNING" => "warn"
      "ERROR" => "error"
      "CRITICAL" => "critical"
    }
    fallback => "info"
  }
  
  # Extract file and line information
  if [source] {
    mutate {
      rename => { "[source][file]" => "[log][origin][file][name]" }
      rename => { "[source][line]" => "[log][origin][file][line]" }
      rename => { "[source][function]" => "[log][origin][function]" }
    }
  }
  
  # Add host information
  mutate {
    add_field => {
      "[host][name]" => "%{[agent][hostname]}"
    }
  }
  
  # Date parsing
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => ["agent", "ecs", "input", "log", "tags"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "jobswipe-logs-%{+YYYY.MM.dd}"
    
    # Authentication for production
    user => "${ELASTICSEARCH_USERNAME:}"
    password => "${ELASTICSEARCH_PASSWORD:}"
    
    # SSL settings for production
    ssl => ${ELASTICSEARCH_SSL:false}
    ssl_certificate_verification => ${ELASTICSEARCH_SSL_VERIFY:false}
    
    # Template settings
    template_name => "jobswipe-logs"
    template_overwrite => false
  }
  
  # Also output to stdout for debugging (can be removed in production)
  stdout {
    codec => rubydebug
  }
}
