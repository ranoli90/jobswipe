# fly.toml app configuration file for JobSwipe Flutter Web
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jobswipe-web'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile.web"

[env]
  ENVIRONMENT = 'production'
  PORT = '8080'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 5

  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

# VM configuration - shared CPU is sufficient for static file serving
[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']

# TLS configuration
[tls]
  auto_renew = true
  minimum_version = 'TLSv1.2'

# Logging
[log]
  level = 'info'
  format = 'json'
