name: jobswipe
description: A modern, cross-platform job search and application app with swipe interface.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^9.2.0
  
  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio_smart_retry: ^7.0.1
  
  # File Handling
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  file_picker: ^10.3.10
  image_picker: ^1.0.7
  
  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0
  
  # Animations
  animations: ^2.0.11
  flutter_card_swiper: ^7.0.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  json_annotation: ^4.8.1
  
  # Connectivity
  connectivity_plus: ^7.0.0
  rxdart: ^0.28.0
  
  # Biometrics
  local_auth: ^2.1.8
  
  # Permissions
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.0
  fluttertoast: ^9.0.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.6.3
  integration_test:
    sdk: flutter
  freezed: ^3.0.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - .env  # Required for web development

